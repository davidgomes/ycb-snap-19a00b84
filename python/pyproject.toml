[project]
name = "badge-forge-worker"
version = "0.1.0"
description = "Python Oban worker for BadgeForge"
requires-python = ">=3.12"
dependencies = [
    "oban==0.6.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["badge_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
