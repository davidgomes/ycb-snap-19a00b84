[project]
name = "badge-forge"
version = "0.1.0"
description = "Python Oban worker that processes badge generation jobs enqueued from the Elixir app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["oban>=0.6.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["badge_forge"]
